<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6C5CE7">
    <title>eAukcija.me - Aukcije u Crnoj Gori</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    
    <!-- Force dark mode immediately -->
    <script>
        if (!localStorage.getItem('theme') || localStorage.getItem('theme') === 'dark') {
            document.documentElement.style.setProperty('--bg', '#0F1429');
            document.documentElement.style.setProperty('--card-bg', '#1A1F38');
        }
    </script>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splashScreen">
    <div class="splash-content">
        <div style="font-size:4rem;margin-bottom:50px;">🔨</div>
        <div style="font-size:1.5rem;font-weight:400;line-height:1.8;">
            <span style="background:linear-gradient(135deg,#00D9FF,#FF3366);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline;">Dobrodošli na</span>
            <br>
            <span style="background:linear-gradient(135deg,#00D9FF,#FF3366);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline;font-size:2rem;font-weight:700;">eAukcija.me</span>
            <br>
            <span style="background:linear-gradient(135deg,#00D9FF,#FF3366);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline;font-size:1.1rem;">Prva aukcijska platforma u Crnoj Gori</span>
        </div>
        <div class="splash-loader" style="margin-top:50px;"></div>
    </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none;">
    
    <!-- HEADER -->
    <header class="header">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="logo">eAukcija.me</div>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>
        <button class="auth-btn" onclick="openAuthModal('login')" id="authButton">Prijava</button>
    </header>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>MENI</h3>
            <button class="close-btn" onclick="toggleSidebar()">×</button>
        </div>
        <nav class="sidebar-nav">
            <a href="#" onclick="showPage('home')">🏠 Početna</a>
            <a href="#" onclick="showPage('create')">➕ Dodaj Oglas</a>
            <a href="#" onclick="showPage('myAuctions')">👤 Moji Oglasi</a>
            <hr style="border:none;border-top:1px solid #2A3150;margin:15px 0;">
            <a href="#" onclick="showPage('vip')" style="background:linear-gradient(135deg,rgba(255,215,0,0.1),rgba(255,165,0,0.1));">💎 VIP - Uskoro</a>
            <a href="#" onclick="showPage('premium')" style="background:linear-gradient(135deg,rgba(108,92,231,0.1),rgba(0,217,255,0.1));">⭐ Premium - Uskoro</a>
            <hr style="border:none;border-top:1px solid #2A3150;margin:15px 0;">
            <a href="#" onclick="showPage('rewards')">🏆 Nagrade</a>
            <a href="#" onclick="showPage('suggestions')">💡 Sugestije</a>
            <a href="#" onclick="showPage('donations')">❤️ Donacije</a>
            <a href="#" onclick="showPage('terms')">📜 Pravila i Uslovi</a>
            <a href="#" onclick="showPage('help')">❓ Pomoć</a>
            <a href="#" onclick="showPage('admin')" id="adminLink" style="display:none;">🔐 Admin Panel</a>
        </nav>
    </div>
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content" id="mainContent">
        <!-- Dynamic content here -->
    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <button onclick="showPage('home')" class="nav-btn active" data-page="home">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Početna</span>
        </button>
        <button onclick="showPage('create')" class="nav-btn" data-page="create">
            <span class="nav-icon">➕</span>
            <span class="nav-label">Dodaj</span>
        </button>
        <button onclick="showPage('myAuctions')" class="nav-btn" data-page="myAuctions">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Moji</span>
        </button>
        <button onclick="showPage('suggestions')" class="nav-btn" data-page="suggestions">
            <span class="nav-icon">💡</span>
            <span class="nav-label">Sugestije</span>
        </button>
    </nav>

</div>

<!-- MODAL CONTAINER -->
<div id="modalContainer"></div>

<script src="app.js"></script>
</body>
</html>
